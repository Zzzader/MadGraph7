
stages:
  - unit-tests
  - some-other-test


trigger-unit-test-pipeline:
  stage: unit-tests
  trigger:
    include: .gitlab-pipelines/unit-tests.yml
    strategy: mirror

trigger-some-heavy-test-pipeline:
  stage: some-other-test
  trigger:
    include: .gitlab-pipelines/heavy-test.yml
    strategy: mirror


