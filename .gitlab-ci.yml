notif-job:
  stage: notif
  when: always
  script:
    - echo "this job will always run after the other jobs are done"
    - |
      RESPONSE=$(curl -L \
        -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $BEARER_TOKEN" \
        -H "X-GitHub-Api-Version: 2026-03-10" \
        https://api.github.com/repos/$OWNER/$REPO/actions/workflows/$WORKFLOW/dispatches \
        -d "{\"ref\":\"main\",\"inputs\":{\"gitlab_pipeline_id\":\"$CI_PIPELINE_ID\"}}")
    - echo $RESPONSE
